# MikosAI Capability Ledger
#
# SATU-SATUNYA sumber kebenaran kemampuan. Tidak ada registry kedua.
# Add-in, MCP server, UI, dan golden test semuanya membaca file ini.
#
# ATURAN:
#   - Hanya status `verified` dan `pilot` yang diekspos sebagai tool MCP.
#   - `reference_only` dan `not_implemented` TIDAK PERNAH terlihat oleh AI.
#   - Promosi ke `verified` butuh: golden test lulus di SolidWorks nyata,
#     versi tercatat, dan 3 kali lulus berturut-turut.
#   - Menaikkan status tanpa bukti test adalah pelanggaran paling serius di repo ini.

schema_version: "1.0"

# Versi yang diuji. Jangan klaim versi yang belum pernah dijalankan.
# Versi tempat KEMAMPUAN CAD sudah lulus golden test.
#
# Terisi pada 2026-11-05, setelah golden test baca lulus terhadap part acuan
# yang nilai harapannya diturunkan dari geometri - bukan disalin dari keluaran
# tool. Ini TERPISAH dari verified_hosts di bawah: yang itu membuktikan add-in
# bisa dimuat, yang ini membuktikan pembacaannya benar.
verified_versions:
  # Daftar revisi SolidWorks tempat KEMAMPUAN CAD sudah lulus golden test.
  # Bentuknya daftar string - skema ledger menuntut itu, dan struktur
  # bersarang di sini membuat seluruh berkas gagal diurai.
  #
  # Terisi 2026-11-05 oleh golden test baca:
  #
  #   acuan   : tests/golden/plat-referensi.SLDPRT (plat 100x80x10, Plain
  #             Carbon Steel) - volume 80000 mm3, massa 624 g, luas 19600 mm2,
  #             pusat massa (0,0,5), keempatnya dihitung lebih dulu dengan
  #             pensil, bukan disalin dari keluaran tool
  #   skrip   : scripts/golden-document.ps1
  #   hasil   : 33 lulus / 0 gagal, EMPAT kali berturut-turut
  #   build   : add-in 62d5aa8, sama dengan HEAD saat diuji
  #
  # Golden test itu tidak sekadar membenarkan kami: pada percobaan pertama ia
  # MENOLAK pembacaan kami sendiri dan membongkar pemetaan
  # swConstrainedStatus_e yang bergeser satu. Baris ini ditulis setelah bug itu
  # diperbaiki, bukan sebelumnya.
  solidworks:
    - "33.1.1"

# Lingkungan tempat add-in host terbukti hidup: ConnectToSW selesai, callback
# terdaftar, thread utama tertangkap, dan tidak ada error tercatat.
#
# Ini terpisah dari verified_versions dengan sengaja. Yang dibuktikan di sini
# adalah add-in bisa dimuat dan API bisa dipanggil - tidak ada klaim soal
# kebenaran geometri.
verified_hosts:
  - solidworks: "2025"
    revision: "33.1.1"          # SP01.1
    verifiedOn: "2026-11-04"
    gates: 7                    # ketujuh gerbang -Action Probe lulus
    taskpane: polos             # WinForms biasa; WebView2 menjatuhkan host ini
    notes: >
      Terbukti di dua mesin terpisah, termasuk satu yang memasang SolidWorks di
      drive selain C:. PIA direferensi dengan EmbedInteropTypes, jadi tidak ada
      dependensi assembly SolidWorks saat runtime.

      Sesi penuh terbukti selesai bersih pada 2026-11-04: TaskPane terpasang,
      server MCP hidup, lalu SolidWorks ditutup normal dan DisconnectFromSW
      berjalan sampai habis. Buktinya status "disconnected" di host-status.json
      dan crash.log yang kosong dari exception - bukan sekadar tidak adanya
      laporan crash.

      Rantai penuh terbukti 2026-11-04: agy memanggil get_active_document lewat MCP di
      dalam SolidWorks yang berjalan dan melaporkannya apa adanya. Angka properti massa
      diaudit terhadap materialnya - volume 100266,145 mm3 dengan densitas 7800 kg/m3
      memberi 782,08 g, dan itu cocok dengan massGrams yang dilaporkan. Audit itulah yang
      lebih dulu membongkar bug densitas default: angka 100,27 g sebelumnya berarti 1000
      kg/m3, yaitu air.

      Status TETAP `pilot`, bukan `verified`. Satu part yang benar bukan golden test, dan
      aturannya tidak dilonggarkan karena hasilnya menyenangkan.

      TaskPane WAJIB panel WinForms biasa di host ini. WebView2 menjatuhkan
      SolidWorks lewat structured exception native yang tidak lewat CLR sama
      sekali, jadi tidak ada try/catch managed yang bisa menangkapnya. Ia tetap
      ada di balik MIKOSAI_ENABLE_WEBVIEW2 untuk dicoba di host lain, dan sampai
      ada host yang membuktikannya aman, panel polos adalah satu-satunya jalur
      yang didukung.

tested_providers: []      # diisi di Fase 2, mis. [{id: antigravity, version: "1.0.6"}]

# ---------------------------------------------------------------------------
# Status: verified | pilot | reference_only | not_implemented
# ---------------------------------------------------------------------------

capabilities:

  # ---- Fase 1: read-only ------------------------------------------------
  - id: document_inspection
    label: Baca dokumen aktif, fitur, dan properti massa
    status: verified
    phase: 1
    review_required: false
    tools:
      - get_active_document
      - list_features
      - get_bounding_box
      - get_mass_properties
      - inspect_sketches
      - get_selection
    notes: >
      Read-only. Tidak menulis apa pun ke model, jadi kegagalannya tidak bisa
      merusak pekerjaan pengguna - itu alasan kemampuan ini yang pertama
      diekspos.

      Status `verified` sejak 2026-11-05. Logika pembentukan hasil dan aturan
      verifikasinya diuji otomatis di MikosAI.Core, dan penerjemahan API
      SolidWorks-nya dibuktikan golden test di SW2025 SP01.1 - 33 pemeriksaan,
      empat kali berturut-turut.

      Golden test ada di `scripts/golden-document.ps1` dengan acuan
      `tests/golden/plat-referensi.SLDPRT` - plat 100x80x10 yang seluruh nilai
      harapannya DITURUNKAN DARI GEOMETRI, bukan disalin dari keluaran tool.

      Pada 2026-11-05 golden test itu langsung membongkar satu bug nyata:
      pemetaan `swConstrainedStatus_e` bergeser satu, sehingga sketsa fully
      defined dilaporkan OverDefined - dan sketsa under-defined dilaporkan
      FullyDefined. Arah kedua itu yang berbahaya, karena sketsa yang belum
      terdefinisi lolos sebagai sehat.

      Itu sekaligus jawaban kenapa status ini tidak dinaikkan lebih awal: empat
      tool membaca dengan benar bukan berarti keenamnya benar.

      BATAS YANG DIKETAHUI: `get_selection` tidak tercakup golden test, karena
      hasilnya bergantung pada apa yang sedang dipilih pengguna dan part acuan
      tidak bisa membawa seleksi. Yang diuji hanya bahwa jalurnya hidup.

      Terbukti pada add-in build 62d5aa8, yaitu commit yang sama dengan HEAD
      saat pengujian - jadi yang diuji memang kode yang tercatat.

      DIVERIFIKASI ULANG pada build 8dd3dec, 2026-11-09: golden-document.ps1
      34/0. Pembaca sudah berubah banyak sejak 62d5aa8 - pemisahan konsumen
      dari dependent, tiga ember dimensi, dan konektivitas sketsa - jadi klaim
      lama tidak lagi menjelaskan kode yang berjalan. Run ulang ini yang
      menambatkannya kembali.

      Bukti tambahan pada build yang sama:
        golden-sketsa.ps1  33/0, nol hipotesis patah
        golden-kontur.ps1  144/0

      `verified` di sini berarti: pembacaannya benar untuk part prismatik
      sederhana di SW2025 SP01.1. Ia TIDAK berarti benar untuk assembly,
      permukaan, atau konfigurasi ganda - itu belum pernah diuji, dan arti
      `verified` hanya berguna selama ia tidak dilebarkan diam-diam.

  # ---- Fase 3: sketsa ---------------------------------------------------
  - id: parametric_block
    label: Balok parametrik pada part baru
    status: pilot
    phase: 3
    review_required: true
    tools:
      - create_parametric_block
    verification:
      - new_document_only
      - sketch_fully_defined
      - driving_dimension_readback
      - rebuild_clean
      - body_size_and_volume
      - save_close_reopen_readback
    notes: >
      Lingkup sempit: corner rectangle di Front Plane, blind normal, tanpa
      draft, satu body pada part BARU.

      SW_PASS pada build 8dd3dec, 2026-11-09, SolidWorks 33.1.1 - build yang
      TERMUAT sama persis dengan HEAD saat diuji, dan itu syaratnya. Klaim
      sebelumnya menyebut "build dasar 52357c5 dengan perubahan lokal", yang
      tidak bisa dirujuk siapa pun: commit plus perubahan yang tidak
      disebutkan bukan artefak yang bisa dibangun ulang, dan writer-nya sudah
      berubah lagi sesudah run itu.

      Bukti pada 8dd3dec:
        golden-balok.ps1      3/3 balok 100x80x10, volume 80000 mm3,
                              diverifikasi setelah simpan-tutup-buka ulang
        golden-block-flow.ps1 3/3 lewat PlanRunner, reopen, 5 fresh check

      Integrasi PlanRunner/chat tetap pilot dan memerlukan review manusia;
      bukan promosi sketch_authoring atau part_features secara keseluruhan.

      LUBANG HOLE WIZARD: SW_PASS 3/3 pada build fbce808, 2026-11-10,
      SolidWorks 33.1.1. Mounting plate 100x80x10 dengan 4 lubang M6
      counterbore ISO, masing-masing diverifikasi setelah simpan-tutup-buka
      ulang. Posisi (20,20,10) (80,20,10) (20,60,10) (80,60,10) dengan deviasi
      maksimum 0 mm setelah transformasi ruang sketsa dan baliknya.

      Pemeriksaan silang yang berdiri sendiri: empat lubang membuang 870.08045
      mm3 masing-masing, persis sama dengan yang dibuang satu lubang pada run
      sebelumnya - keempatnya identik dan memotong penuh.

      Nilai yang TIDAK kami tentukan, dan karena itu tidak kami patok:
      counterbore 14.547 mm, tembus 6.6 mm, standar "Hex Bolt Grade C ISO
      4016". Semuanya dari basis data Hole Wizard.

      TEREKSPOS LEWAT MCP sejak a7f8bd8, 2026-11-10: create_parametric_block
      menerima `holes` (counterbore, ISO, permukaan atas). golden-plat-flow.ps1
      SW_PASS 3/3 lewat tools/call, termasuk dua penolakan tanpa menyentuh
      model. golden-plat.ps1 SW_PASS 3/3 dengan posisi lubang dibaca SETELAH
      reopen.

      Koreksi atas run fbce808: posisinya waktu itu diverifikasi SEBELUM simpan,
      walau skripnya berkomentar sebaliknya. Klaim posisi-setelah-reopen baru
      berlaku sejak a7f8bd8.

      Batas yang diakui: sketsa posisi under-defined - titik ditaruh dengan
      koordinat, bukan dimensi desain.

      Snapshot sengaja TIDAK ada, dan itu konsekuensi lingkup - bukan celah.
      Writer memanggil NewDocument, jadi ia selalu membuat part baru dan tidak
      pernah menyentuh dokumen yang sudah dibuka pengguna. Begitu lingkupnya
      dilebarkan ke dokumen yang sudah ada, perlindungan itu hilang dan
      snapshot menjadi wajib.
      operationId dipertahankan per sesi: pemanggilan ulang mengembalikan
      hasil lama, bukan menulis ulang. Tidak retry/rollback otomatis.

  - id: sketch_authoring
    label: Buat sketsa dengan geometri dasar dan fully define
    status: not_implemented
    phase: 3
    review_required: true
    tools:
      - create_sketch
      - add_rectangle
      - add_circle
      - add_slot
      - diagnose_sketch
      - close_sketch
    verification:
      - sketch_exists_in_tree
      - constrained_status_read        # GetConstrainedStatus, BUKAN Fix massal
      - consumed_by_target_feature
    notes: >
      `fully_define_sketch` DIHAPUS pada 2026-11-05, diganti `diagnose_sketch`
      yang read-only.

      Alasannya ada di tanda tangan API-nya sendiri:
      ISketchManager.FullyDefineSketch menerima HorizontalDimScheme,
      VerticalDimScheme, dan datum display - artinya ia MEMILIH skema dimensi
      dan datum. Itu keputusan desain, bukan formalitas: skema datum menentukan
      bagaimana part berubah ketika parameter diubah.

      Bahayanya sunyi. Sketsa yang fully defined lewat dimensi pilihan mesin
      lolos SELURUH verifikasi kami - constrainedStatus hijau, verdict PASS -
      sementara partnya salah dengan cara yang tidak satu pun check kami
      tangkap. Begitu add_relation ada, tool itu juga jadi jalan belakang ke
      larangan Fix massal.

      Sketsa harus memakai dimensi desain eksplisit. Dimensi yang tidak pernah
      disebut pengguna menjadi openQuestions, bukan tebakan mesin.

  # ---- Fase 3: fitur ----------------------------------------------------
  - id: part_features
    label: Extrude boss/cut, fillet, chamfer
    status: not_implemented
    phase: 3
    review_required: true
    tools:
      - extrude_boss
      - extrude_cut
      - fillet
      - chamfer
    verification:
      - feature_exists_in_tree
      - rebuild_succeeds               # EditRebuild3, tanpa rebuild error
      - nonzero_volume
      - save_reopen_dimension_readback # paling sering dilewati, paling sering menangkap bug

  - id: hole_features
    label: Hole wizard - blind, counterbore, countersink, tapped
    status: not_implemented
    phase: 3
    review_required: true
    tools:
      - hole_wizard
    verification:
      - feature_exists_in_tree
      - hole_positions_match_plan
      - rebuild_succeeds
      - save_reopen_dimension_readback
    notes: >
      Tipe lubang, datum, dan toleransi TIDAK BOLEH ditebak dari geometri.
      Kalau plan tidak menyebutnya, hasilnya review_required.

      M0 HANYA MEMBUKA holeType `simple` dan `counterbore`. Tipe lain tetap ada
      di enum skema, tapi executor mengembalikan BLOCKED
      "holeType belum terverifikasi" sampai test urutan parameternya SW_PASS.

      Alasannya HoleWizard5 punya dua belas parameter Double bernama
      Value1..Value12 yang artinya BERGANTUNG TIPE LUBANG, dan namanya tidak
      memberi petunjuk apa pun. Satu test urutan parameter tidak bisa mewakili
      tipe yang lain, jadi tiap tipe dibuka setelah test-nya sendiri lulus di
      SolidWorks nyata.

      Posisi lubang TIDAK pernah masuk lewat HoleWizard5 - API itu tidak punya
      satu pun parameter koordinat. Posisi ditaruh sebagai titik sketsa lewat
      ISketchManager.CreatePoint, yang koordinatnya ADALAH RUANG SKETSA, bukan
      koordinat model. Lihat catatan hole_wizard di schemas/tools.json.

  - id: patterns
    label: Linear pattern
    status: not_implemented
    phase: 3
    review_required: true
    tools:
      - linear_pattern
    verification:
      - instance_count_matches_plan
      - rebuild_succeeds

  # ---- Fase 3: eksekusi plan -------------------------------------------
  - id: design_plan_execution
    label: Eksekusi DesignPlan tervalidasi skema
    status: not_implemented
    phase: 3
    review_required: true
    tools:
      - run_design_plan
      - validate_design_plan
    notes: >
      Plan divalidasi terhadap skema SEBELUM eksekusi. Plan yang tidak valid
      ditolak tanpa menyentuh model.

  # ---- Setelah v0.1 ----------------------------------------------------
  - id: semantic_entity_reference
    label: Pemilihan face/edge lewat kriteria stabil
    status: not_implemented
    phase: post-v0.1
    review_required: true
    notes: >
      Prioritas 1 setelah v0.1. Face1/Edge1 dan koordinat layar dilarang di
      seluruh repo. Pendekatan: normal + centroid, lalu persistent reference ID
      lewat IModelDoc2.Extension.GetPersistReference3.

  - id: drawing_automation
    label: Pembuatan drawing, view, dimensi, GD&T
    status: not_implemented
    phase: post-v0.1
    review_required: true
    notes: >
      API drawing rapuh antarversi SolidWorks. Butuh matriks versi sendiri.
      Verifikasi sebaiknya lewat baca ulang PDF hasil export (sidecar Python).

  - id: assembly_and_mates
    label: Komponen assembly dan mate
    status: not_implemented
    phase: post-v0.1
    review_required: true
    notes: Butuh semantic_entity_reference yang sudah kuat lebih dulu.

  - id: export_delivery
    label: Export STEP/STL/PDF, BOM, Pack and Go
    status: not_implemented
    phase: post-v0.1
    review_required: true

  - id: fea_preflight
    label: Persiapan input FEA dan audit hasil
    status: not_implemented
    phase: post-v0.1
    review_required: true
    notes: >
      Selalu pilot, selalu butuh review insinyur. Butuh solver eksternal,
      bukti material, dan bukti kondisi batas. Tidak pernah unattended.

# ---------------------------------------------------------------------------
# Backend. v0.1 hanya satu. Daftar ini ada supaya penambahan nanti tidak
# memaksa perubahan skema.
# ---------------------------------------------------------------------------

backend_catalog:
  solidworks-csharp-addin:
    language: C#
    runtime: in_process_managed_addin
    suitable_for:
      - Seluruh operasi CAD v0.1
      - Langganan event
      - PropertyManagerPage dan TaskPane
      - Callback UI yang hidup lama
    limitations:
      - Butuh registrasi Machine, TLB, dan deployment terpercaya
      - Crash menjatuhkan SolidWorks - wajib lewat MainThreadDispatcher
      - Bukan pengganti interface yang hanya tersedia untuk C++ unmanaged

  python-sidecar:
    language: Python
    runtime: external_process
    suitable_for:
      - OCCT dan format terbuka
      - Konversi mesh
      - Baca ulang PDF untuk verifikasi drawing
      - Orkestrasi solver FEA
    limitations:
      - Tidak bisa membuat atau memverifikasi semantik feature tree SLDPRT native
    status: not_implemented
